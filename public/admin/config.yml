# local_backend: true
# 1. 後端儲存庫設定
backend:
  name: github
  repo: pengin0913/my-knowledge-base    # 請替換為真實的 GitHub 儲存庫路徑 (如: shengquan/my-knowledge-base)
  branch: main                          # 文章發布後要提交到的分支
  base_url: https://my-knowledge-base.pengin0913.workers.dev # 填入你的 Worker 網址
  auth_endpoint: auth

# 2. 圖片/多媒體資源存放路徑
media_folder: "public/uploads"          # 圖片上傳時儲存在專案的實體位置，請建立好目錄uploads
public_folder: "/uploads"               # 在網頁 HTML 中參照的公開網址

# 3. 內容集合設定 (Collections)
collections:
  - name: "docs"
    label: "知識庫文章"
    folder: "src/content/docs"          # 對應 Astro 的 content collection 位置
    create: true                        # 允許編輯者在線上新增文章
    slug: "{{topicId}}/{{fields.slug}}" # 存檔路徑規則：主題代碼/子題檔名.md
    summary: "{{title}} (主題: {{topic}})" # 後台文章清單顯示標題與主題
    # 核心設定：啟用官方巢狀目錄
    nested:
      depth: 3                          # 支援 3 層深度 (根目錄 -> 主題分類 -> 子文章)
    
    # 只要保留這段：未來不論新增第 3 類「影音剪輯」或第 4 類「數學遊戲」，
    # 後台會依據填寫的 topic 自動生成分類折疊群組，一勞永逸！
    #view_groups:
    #  - label: "主題分類"
    #    field: "topic"

    fields:
      - label: "文章標題"
        name: "title"
        widget: "string"

      - label: "自訂網址代碼 (Slug)"
        name: "slug"
        widget: "string"
        hint: "例如：01-turing-test (僅限英數字與連字號，將作為檔案名稱)"

      - label: "所屬主題名稱"
        name: "topic"
        widget: "string"
        default: "AI發展史"
        hint: "用於前台顯示的主題名稱，例如：AI發展史、Web前端開發"

      - label: "主題識別碼 (Topic ID)"
        name: "topicId"
        widget: "string"
        default: "ai-history"
        hint: "用於網址與分類資料夾，例如：ai-history、web-dev"

      - label: "選單排序 (權重)"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "數字越小在側邊導航選單中排越前面"

      - label: "文章摘要"
        name: "description"
        widget: "text"
        required: false

      - label: "文章內容 (HTML/Markdown 所見即所得)"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block